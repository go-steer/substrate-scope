name: CI

on:
  push:
    branches: [main]
  # Every PR, including ones stacked on a feature branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt and goimports
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build
        run: go build ./cmd/substrate-scope

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: syntax check and eslint
        run: make lint
      - name: unit tests
        run: node --test web/js/*.test.js

  # Builds the image on every PR; on main it also pushes it, tagged with the
  # commit, to the ax registry. GitHub's OIDC token is exchanged for the
  # substrate-scope-image service account through the github-actions pool's
  # substrate-scope-image provider, which only accepts this repo's main.
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: us-central1-docker.pkg.dev/gke-demos-345619/ax/substrate-scope
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        if: env.PUSH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1067056737933/locations/global/workloadIdentityPools/github-actions/providers/substrate-scope-image
          service_account: substrate-scope-image@gke-demos-345619.iam.gserviceaccount.com
          token_format: access_token
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:main
      - name: digest
        if: env.PUSH == 'true'
        run: echo "Pushed \`$IMAGE@${{ steps.build.outputs.digest }}\` (\`:${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"

  # Deploys every merge to main, once tests pass and the image is pushed:
  # applies deploy/substrate-scope.yaml with the image digest just built and
  # waits for the rollout. Same service account as the image job; on the
  # cluster it may only touch the substrate-scope namespace (deploy/ci-rbac.yaml).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, image]
    runs-on: ubuntu-latest
    environment: agent-substrate
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/gke-demos-345619/ax/substrate-scope
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1067056737933/locations/global/workloadIdentityPools/github-actions/providers/substrate-scope-image
          service_account: substrate-scope-image@gke-demos-345619.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: agent-substrate
          location: us-central1
          project_id: gke-demos-345619
          use_dns_based_endpoint: true
      - name: apply
        run: |
          test -n "$DIGEST"
          sed "s#image: $IMAGE@sha256:[0-9a-f]*#image: $IMAGE@$DIGEST#" deploy/substrate-scope.yaml > /tmp/substrate-scope.yaml
          grep -q "image: $IMAGE@$DIGEST" /tmp/substrate-scope.yaml
          kubectl apply -f /tmp/substrate-scope.yaml
          kubectl -n substrate-scope rollout status deploy/substrate-scope --timeout=5m
          echo "Deployed \`$IMAGE@$DIGEST\` to agent-substrate." >> "$GITHUB_STEP_SUMMARY"
