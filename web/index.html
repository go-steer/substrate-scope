<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>substrate-scope</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>

    <header id="topbar">
      <div class="brand">
        <span class="logo"></span>
        <span class="title">substrate<span class="thin">scope</span></span>
        <span class="sep"></span>
        <span id="cluster" class="cluster"></span>
        <span id="conn" class="conn connecting"><span class="led"></span><span class="txt">connecting</span></span>
      </div>
      <div id="legend" class="legend"></div>
      <div class="filters">
        <select id="atespace" aria-label="Atespace"><option value="">All atespaces</option></select>
        <input id="prefix" type="search" placeholder="Name prefix  /" spellcheck="false" autocomplete="off" aria-label="Name prefix" />
        <button id="home" class="icon" title="Show the whole cluster (h)">⌂</button>
      </div>
    </header>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <section id="feedwrap">
      <div class="feed-title">Live events</div>
      <div id="feed"></div>
    </section>

    <footer id="statusbar">
      <span id="total"></span>
      <span id="health"></span>
      <span class="spacer"></span>
      <span id="seq"></span>
      <span id="clock"></span>
    </footer>

    <div id="tooltip"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
