<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>substrate-scope</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewport"></div>

    <header id="topbar">
      <div class="brand">
        <span class="logo"></span>
        <span class="title">substrate<span class="thin">scope</span></span>
        <span class="sep"></span>
        <span id="cluster" class="cluster"></span>
        <span id="conn" class="conn connecting"><span class="led"></span><span class="txt">connecting</span></span>
      </div>
      <div id="legend" class="legend"></div>
      <div class="filters">
        <select id="atespace" aria-label="Atespace"><option value="">All atespaces</option></select>
        <input id="prefix" type="search" placeholder="Name prefix  /" spellcheck="false" autocomplete="off" aria-label="Name prefix" />
        <div id="layout" class="seg" role="group" aria-label="Layout" title="Layout: agents and workers on two decks (1, 2, 3 fade them), or one island">
          <span class="seg-k">Layout</span><button data-layout="decks" aria-pressed="true">decks</button><button data-layout="combined" aria-pressed="false">combined</button>
        </div>
        <div id="group" class="seg" role="group" aria-label="Group agents by" title="Group agents by atespace or by the worker they run on (g)">
          <span class="seg-k">Group</span><button data-group="atespace" aria-pressed="true">atespace</button><button data-group="worker" aria-pressed="false">worker</button>
        </div>
        <button id="labels" class="labels-btn" title="Agent labels: auto shows the selected agent, recent changes and close-ups; all; off (l)">Labels: auto</button>
        <button id="home" class="icon" title="Show the whole cluster (h)">⌂</button>
        <select id="router-pick" class="look-pick" aria-label="Router look" title="Router: how the atenet router looks"></select>
        <select id="agents-pick" class="look-pick" aria-label="Agent shape" title="Agents: the shape of each agent (x toggles idle rings and particles)"></select>
        <div id="themes" class="themes"></div>
      </div>
    </header>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <aside id="feedpanel" class="feed-panel" aria-label="Live events">
      <div class="feed-head">
        <h3>Live events</h3>
        <span id="feedcount" class="muted small"></span>
        <button id="feed-collapse" class="close" title="Hide live events (e)">‹</button>
      </div>
      <div id="feed" class="feed-list"></div>
    </aside>
    <button id="feed-tab" class="feed-tab" title="Show live events (e)">Events<span id="feed-unread" class="unread"></span></button>

    <footer id="statusbar">
      <span id="total"></span>
      <span id="health"></span>
      <span class="spacer"></span>
      <span id="seq"></span>
      <span id="clock"></span>
    </footer>

    <div id="tooltip"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
