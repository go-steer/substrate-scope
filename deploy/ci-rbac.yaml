# What CI's deploy job may do on the cluster: apply substrate-scope.yaml
# (ServiceAccount, Deployment, Service) and watch the rollout, in this
# namespace only. CI acts as the substrate-scope-image Google service account
# (workload identity federation, main only), which also needs
# roles/container.clusterViewer on the project to reach the control plane.
# Applied once by hand; CI can't change its own rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-scope-deployer
  namespace: substrate-scope
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-scope-deployer
  namespace: substrate-scope
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: substrate-scope-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: substrate-scope-image@gke-demos-345619.iam.gserviceaccount.com
