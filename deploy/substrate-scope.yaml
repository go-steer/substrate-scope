# substrate-scope on one cluster: the collector polls Agent Substrate and ax
# and serves the UI on :8080. Access it with
#   kubectl -n substrate-scope port-forward svc/substrate-scope 8080:80
#
# The attach proxy is off unless the Secret "substrate-scope-attach" exists
# (key "token": the bearer token agents expect on their session API):
#   kubectl -n substrate-scope create secret generic substrate-scope-attach --from-file=token=PATH
apiVersion: v1
kind: Namespace
metadata:
  name: substrate-scope
---
# Substrate v0.3.0 authorizes only atespace calls; the list calls the
# collector makes are open to any authenticated service account. Grant
# Substrate's global viewer role to this account once actor calls are
# enforced.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-scope
  namespace: substrate-scope
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-scope
  namespace: substrate-scope
  labels:
    app.kubernetes.io/name: substrate-scope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-scope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: substrate-scope
    spec:
      serviceAccountName: substrate-scope
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: substrate-scope
          image: us-central1-docker.pkg.dev/gke-demos-345619/ax/substrate-scope@sha256:b5157ac73882f941acadb5a89665157b00a5eae63ecefec502b9fdb736117fbf
          args:
            - "--addr=:8080"
            - "--cluster=agent-substrate"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--ax-endpoint=ax-server.ax-system.svc.cluster.local:8080"
            - "--router=atenet-router.ate-system.svc.cluster.local:80"
            - "--attach-token-file=/run/attach/token"
            # The UI is reached through Cloud Workstations' port proxy, which
            # rewrites Host, so the browser's Origin must be allowed explicitly.
            - "--allowed-origins=*.cloudworkstations.dev"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
            - mountPath: /run/attach
              name: attach-token
              readOnly: true
      volumes:
        # Same mechanism as ax-server: a projected token for the control
        # API's audience, and the servicedns CA bundle that signs its cert.
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        - name: attach-token
          secret:
            secretName: substrate-scope-attach
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-scope
  namespace: substrate-scope
  labels:
    app.kubernetes.io/name: substrate-scope
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: substrate-scope
